<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moni-rs PoC</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --mute:#6b6b6b; --line:#e5e5e5; --ok:#1a7f37; --bad:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#e8e8e8; --mute:#9a9a9a; --line:#2a2a2a; --ok:#4ac26b; --bad:#ff6b6b; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, sans-serif; }
  header { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  input { padding:6px 8px; border:1px solid var(--line); background:transparent; color:inherit; border-radius:4px; }
  button { padding:6px 12px; border-radius:4px; border:1px solid var(--line); background:transparent; color:inherit; cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--mute); font-weight:500; }
  .wrap { overflow-x:auto; }
  .on { color:var(--ok); } .off { color:var(--bad); }
  #status { color:var(--mute); }
  pre { color:var(--mute); font-size:12px; max-height:200px; overflow:auto; }
</style>
</head>
<body>
<header>
  <strong>moni-rs</strong>
  <input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
  <button id="connect">连接</button>
  <span id="status">未连接</span>
</header>
<div class="wrap">
<table>
  <thead><tr><th>服务器</th><th>状态</th><th>CPU</th><th>内存</th><th>磁盘</th><th>↓</th><th>↑</th><th>Load</th><th>Seq</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<pre id="log"></pre>
<script>
const servers = new Map();
const $ = (id) => document.getElementById(id);
const pct = (u, t) => t ? (u * 100 / t).toFixed(1) + '%' : '-';
const rate = (b) => b >= 1048576 ? (b / 1048576).toFixed(2) + ' MB/s' : (b / 1024).toFixed(1) + ' KB/s';
const log = (m) => { $('log').textContent = new Date().toLocaleTimeString() + ' ' + m + '\n' + $('log').textContent.slice(0, 4000); };

function render() {
  $('rows').innerHTML = [...servers.values()].map((s) => {
    const m = s.metrics;
    const cells = m
      ? [m.cpu_pct.toFixed(1) + '%', pct(m.mem_used, m.mem_total), pct(m.disk_used, m.disk_total), rate(m.net_rx_bps), rate(m.net_tx_bps), m.load1.toFixed(2), m.seq]
      : ['-', '-', '-', '-', '-', '-', '-'];
    return `<tr><td>${s.server_id}</td><td class="${s.online ? 'on' : 'off'}">${s.online ? '在线' : '离线'}</td>${cells.map((c) => `<td>${c}</td>`).join('')}</tr>`;
  }).join('');
}

let ws, retry = 1000;
function connect() {
  const token = $('token').value;
  try { localStorage.setItem('moni_token', token); } catch {}
  ws?.close();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/dashboard?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { $('status').textContent = '已连接'; retry = 1000; };
  ws.onclose = (e) => { $('status').textContent = `断开 (${e.code})，${retry / 1000}s 后重连`; setTimeout(connect, retry); retry = Math.min(retry * 2, 30000); };
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    switch (ev.type) {
      case 'snapshot': servers.clear(); ev.servers.forEach((s) => servers.set(s.server_id, s)); log(`snapshot: ${ev.servers.length} servers`); break;
      case 'online': servers.set(ev.server_id, { ...(servers.get(ev.server_id) || { server_id: ev.server_id }), online: true }); log(`online ${ev.server_id}`); break;
      case 'offline': { const s = servers.get(ev.server_id); if (s) { s.online = false; s.metrics = null; } log(`offline ${ev.server_id}`); break; }
      case 'metrics': { const s = servers.get(ev.server_id) || { server_id: ev.server_id }; s.online = true; s.metrics = ev.frame; servers.set(ev.server_id, s); break; }
    }
    render();
  };
}
$('connect').onclick = connect;
try { $('token').value = localStorage.getItem('moni_token') || ''; } catch {}
</script>
</body>
</html>
