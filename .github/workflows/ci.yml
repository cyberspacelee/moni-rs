name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p moni-protocol -p moni-agent -- -D warnings
      - run: cargo clippy -p moni-worker --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p moni-protocol -p moni-agent
