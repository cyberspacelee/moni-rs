name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  WORKER_BUILD_VERSION: 0.8.7

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p moni-protocol -p moni-agent -p moni-worker -- -D warnings
      - run: cargo clippy -p moni-worker --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p moni-protocol -p moni-agent
      - run: cargo test -p moni-worker --lib
      - run: cargo test -p moni-protocol --features ts
      - run: git diff --exit-code web/src/api/generated
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter moni-web build
      - name: Cache worker-build
        id: wb-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-${{ runner.os }}-${{ runner.arch }}-${{ env.WORKER_BUILD_VERSION }}
      - name: Install worker-build
        if: steps.wb-cache.outputs.cache-hit != 'true'
        run: cargo install worker-build --version "$WORKER_BUILD_VERSION" --locked
      - run: worker-build --release
        working-directory: crates/worker
      - run: node scripts/test-adaptive-reporting.mjs
      - run: node scripts/test-update-api.mjs
      - run: pnpm --filter moni-web exec playwright-core install --with-deps chromium
      - run: scripts/e2e.sh --quick --ui
      - run: sh -n scripts/install-agent.sh
      - run: sh -n scripts/update-agent.sh
      - run: python3 scripts/test-install-agent.py
      - run: python3 scripts/test-update-agent.py
