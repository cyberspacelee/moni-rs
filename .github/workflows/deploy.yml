# Fork 后一键部署：在仓库 Settings → Secrets and variables → Actions 中配置
#   CLOUDFLARE_API_TOKEN   (模板 "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
#   AGENT_SECRET           (Agent 共享密钥，PoC 阶段)
#   ADMIN_TOKEN            (看板 / API 访问令牌)
# 然后在 Actions 页面手动运行本 workflow。
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["crates/worker/**", "crates/protocol/**", "Cargo.lock", ".github/workflows/deploy.yml"]

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WORKER_BUILD_VERSION: 0.8.7

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 未配置，跳过部署"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.guard.outputs.skip != 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.skip != 'true'
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.skip != 'true'

      - name: Cache worker-build
        if: steps.guard.outputs.skip != 'true'
        id: wb-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-${{ env.WORKER_BUILD_VERSION }}

      - name: Install worker-build
        if: steps.guard.outputs.skip != 'true' && steps.wb-cache.outputs.cache-hit != 'true'
        run: cargo install worker-build --version "$WORKER_BUILD_VERSION" --locked

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install wrangler
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Deploy
        if: steps.guard.outputs.skip != 'true'
        working-directory: crates/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../../node_modules/.bin/wrangler deploy

      - name: Sync secrets
        if: steps.guard.outputs.skip != 'true'
        working-directory: crates/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          f="$RUNNER_TEMP/secrets.json"
          node -e '
            const out = {};
            for (const k of ["AGENT_SECRET", "ADMIN_TOKEN"]) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out));
            console.log("secrets to sync:", Object.keys(out).join(", ") || "(none)");
          ' "$f"
          if [ "$(cat "$f")" != "{}" ]; then ../../node_modules/.bin/wrangler secret bulk "$f"; fi
          rm -f "$f"
