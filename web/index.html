<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1a19" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23c96442'/><path d='M8 21.5v-6.75C8 12.4 9.5 11 11.25 11S14.5 12.4 14.5 14.75v4.75M14.5 14.75c0-2.35 1.5-3.75 3.25-3.75S21 12.4 21 14.75v3.5c0 2 1 3.25 3 3.25' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <title>moni · 服务器监控</title>
    <script>
      // Mirrors lib/theme.ts: apply the last resolved theme before first paint.
      try {
        const a = JSON.parse(localStorage.getItem("moni-applied") || "null") || {};
        const root = document.documentElement;
        root.dataset.theme = a.theme || "clay";
        if (a.mode === "dark" || (a.mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          root.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
