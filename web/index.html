<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23f3f3f0' stroke='%23111' stroke-width='1.5'/><path d='M16 3.2v2.6M28.8 16h-2.6M16 28.8v-2.6M3.2 16h2.6' stroke='%23111' stroke-width='1.6'/><path d='M16 16 11.4 13.3M16 16 22.9 9.1' stroke='%23111' stroke-width='2.4' stroke-linecap='round'/><path d='M16 20.5V6.8' stroke='%23e63312' stroke-width='1.2'/><circle cx='16' cy='7.4' r='2.3' fill='%23e63312'/><circle cx='16' cy='16' r='1.3' fill='%23111'/></svg>" />
    <title>moni · 服务器监控</title>
    <script>
      try {
        const t = localStorage.getItem("moni-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
